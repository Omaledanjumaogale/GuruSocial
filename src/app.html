<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />
		<meta name="description" content="GuruSocial — the harmonized enterprise-grade social media command center. Publish, schedule, engage and measure across 15 platforms from one app, API and MCP server." />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="GuruSocial" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
			media="print"
			onload="this.media='all'"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<!--
			Boot-failure recovery panel. Hidden while the app hydrates; revealed if
			an uncaught error occurs or the app shell fails to mount, so the page is
			never a blank white/black canvas with no way forward.
		-->
		<div id="gs-boot-fallback" hidden>
			<div class="gs-fallback-card" role="alert">
				<div class="gs-fallback-brand"><span>G</span><strong>GuruSocial</strong></div>
				<h1>The app didn’t finish loading</h1>
				<p>
					This is usually a stale cached build or a temporary network problem. Retrying reloads the current
					version of the app.
				</p>
				<div class="gs-fallback-actions">
					<button type="button" onclick="location.reload()">Retry</button>
					<a href="/">Home</a>
					<a href="/auth">Sign in</a>
				</div>
				<p class="gs-fallback-hint" id="gs-boot-detail"></p>
			</div>
		</div>
		<script>
			(function () {
				var fallback = document.getElementById('gs-boot-fallback');
				var detail = document.getElementById('gs-boot-detail');
				var shown = false;
				function show(message) {
					if (shown) return;
					shown = true;
					if (message && detail) detail.textContent = 'Details: ' + message;
					if (fallback) fallback.hidden = false;
				}
				window.addEventListener('error', function (event) {
					var msg = event && event.message ? event.message : 'unknown error';
					// Chunk-load failures are the classic stale-build blank page.
					if (/dynamically imported module|Loading chunk|Importing a module script failed/i.test(msg)) {
						show('A newer version was deployed. Reload to pick it up.');
					} else {
						show(msg);
					}
				});
				window.addEventListener('unhandledrejection', function (event) {
					var reason = event && event.reason ? String(event.reason.message || event.reason) : '';
					if (/dynamically imported module|Loading chunk/i.test(reason)) {
						show('A newer version was deployed. Reload to pick it up.');
					}
				});
				// Slow/blocked hydration: offer recovery rather than a blank screen.
				window.setTimeout(function () {
					var mount = document.querySelector('body > div');
					if (mount && mount.children.length === 0) show('The app shell did not start.');
				}, 12000);
			})();
		</script>
		<style>
			#gs-boot-fallback {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				padding: 24px;
				background: #000;
				color: #f5f5f5;
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			}
			#gs-boot-fallback[hidden] { display: none; }
			.gs-fallback-card {
				width: 100%;
				max-width: 460px;
				border: 1px solid #292929;
				background: #0a0a0a;
				border-radius: 20px;
				padding: 28px;
			}
			.gs-fallback-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
			.gs-fallback-brand span {
				width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
				font-weight: 900; background: linear-gradient(135deg, #6366f1, #22c55e); color: #fff;
			}
			.gs-fallback-card h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.02em; }
			.gs-fallback-card p { margin: 0 0 18px; color: #b8b8b8; font-size: 14px; line-height: 1.6; }
			.gs-fallback-actions { display: flex; flex-wrap: wrap; gap: 10px; }
			.gs-fallback-actions button,
			.gs-fallback-actions a {
				min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
				padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
				border: 1px solid #414141; background: transparent; color: #e5e7eb;
				text-decoration: none; cursor: pointer;
			}
			.gs-fallback-actions button { background: #4f46e5; border-color: #4f46e5; color: #fff; }
			.gs-fallback-hint { margin: 16px 0 0 !important; font-size: 12px !important; color: #909090 !important; }
		</style>
	</body>
</html>
